<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Manager | Infrastructure Documentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141829;
            --accent-primary: #00d4ff;
            --accent-secondary: #00a8cc;
            --accent-danger: #ff6b6b;
            --accent-success: #51cf66;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --text-tertiary: #7a8299;
            --border-color: #2a2f4a;
            --hover-bg: rgba(0, 212, 255, 0.08);
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1535 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        .wrapper { display: flex; height: 100vh; overflow: hidden; }
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: rgba(20, 24, 41, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .logo-section { margin-bottom: 40px; }
        .logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.5px; }
        .logo-subtext { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; }
        .nav-label { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        .nav-items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px; }
        .nav-item {
            padding: 10px 12px; border-radius: 8px; background: transparent;
            border: 1px solid transparent; color: var(--text-secondary);
            cursor: pointer; font-size: 13px; font-weight: 500;
            text-align: left; transition: all 0.2s; font-family: 'Outfit', sans-serif;
        }
        .nav-item:hover { background: var(--hover-bg); color: var(--accent-primary); }
        .nav-item.active { background: rgba(0, 212, 255, 0.1); border-color: var(--accent-primary); color: var(--accent-primary); }
        .main { flex: 1; padding: 32px 40px; overflow-y: auto; min-width: 0; }
        .header { margin-bottom: 28px; }
        .header-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .header-subtitle { color: var(--text-tertiary); font-size: 14px; }
        .card { background: rgba(20, 24, 41, 0.6); border: 1px solid var(--border-color); border-radius: 12px; padding: 28px; width: 100%; max-width: 800px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-tertiary); letter-spacing: 0.5px; }
        input, textarea {
            width: 100%; padding: 11px 14px; background: rgba(26, 31, 58, 0.6);
            border: 1px solid var(--border-color); border-radius: 8px; color: white;
            font-family: 'Outfit', sans-serif; font-size: 14px; transition: border-color 0.2s; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--accent-primary); }
        textarea { font-family: 'JetBrains Mono', monospace; min-height: 90px; resize: vertical; }
        .btn-primary {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none; border-radius: 8px; color: var(--bg-primary); font-weight: 700;
            cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
            font-family: 'Outfit', sans-serif; transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            flex: 1; padding: 12px; background: transparent; border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-secondary); font-weight: 600; cursor: pointer;
            font-family: 'Outfit', sans-serif; font-size: 13px; transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .ticket-card { background: rgba(20, 24, 41, 0.6); border: 1px solid var(--border-color); padding: 18px; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .ticket-card:hover { border-color: var(--accent-primary); transform: translateY(-2px); }
        .ticket-number { font-family: 'JetBrains Mono'; color: var(--accent-primary); font-size: 11px; margin-bottom: 8px; }
        .ticket-title { font-weight: 600; margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
        .ticket-status { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 10px; border: 1px solid; }
        .status-open { color: var(--accent-success); border-color: var(--accent-success); }
        .status-closed { color: var(--accent-danger); border-color: var(--accent-danger); }
        .ticket-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .ticket-tag { font-size: 10px; padding: 3px 8px; background: rgba(0, 212, 255, 0.1); border-radius: 4px; color: var(--accent-primary); }
        .empty-state { text-align: center; padding: 60px; color: var(--text-tertiary); letter-spacing: 1px; font-weight: 600; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,14,39,0.92); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); padding: 32px; border-radius: 12px; width: 100%; max-width: 620px; border: 1px solid var(--border-color); max-height: 85vh; overflow-y: auto; }
        .modal-number { font-family: 'JetBrains Mono'; color: var(--accent-primary); font-size: 11px; margin-bottom: 10px; }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; line-height: 1.3; }
        .modal-body { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary); margin-bottom: 22px; white-space: pre-wrap; line-height: 1.6; }
        .modal-actions { display: flex; gap: 12px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="logo-section">
                <div class="logo-text">INFRA_MANAGER</div>
                <div class="logo-subtext">Version 2.0.0</div>
            </div>
            <div class="nav-section">
                <p class="nav-label">Management</p>
                <div class="nav-items">
                    <button class="nav-item active" onclick="showSection('create', this)">Create Ticket</button>
                    <button class="nav-item" onclick="showSection('tickets', this)">View Archive</button>
                </div>
                <p class="nav-label">Filters</p>
                <div class="nav-items">
                    <button class="nav-item" onclick="loadTickets('open', this)">Active</button>
                    <button class="nav-item" onclick="loadTickets('closed', this)">Resolved</button>
                </div>
            </div>
        </aside>
        <main class="main">
            <div id="createSection">
                <div class="header">
                    <h1 class="header-title">Create Ticket</h1>
                    <p class="header-subtitle">Standardized infrastructure logging for EKS Deployment</p>
                </div>
                <div class="card">
                    <form id="ticketForm">
                        <div class="form-group"><label class="form-label">Title</label><input type="text" id="title" placeholder="Short descriptive title" required></div>
                        <div class="form-group"><label class="form-label">Classification</label><input type="text" id="description" placeholder="One-line summary" required></div>
                        <div class="form-group"><label class="form-label">Technical Details</label><textarea id="body" placeholder="Full description, commands, errors, findings..."></textarea></div>
                        <div class="form-group"><label class="form-label">Labels (comma separated)</label><input type="text" id="labels" placeholder="kubernetes, aws, bug, milestone"></div>
                        <button type="submit" class="btn-primary" id="submitBtn">Commit to Repository</button>
                    </form>
                </div>
            </div>
            <div id="ticketsSection" style="display:none;">
                <div class="header">
                    <h1 class="header-title">System Archive</h1>
                    <p class="header-subtitle">Synchronized repository documentation</p>
                </div>
                <div class="tickets-grid" id="ticketsGrid"><div class="empty-state">SELECT A FILTER TO LOAD TICKETS</div></div>
            </div>
        </main>
    </div>

    <div id="ticketModal" class="modal">
        <div class="modal-content">
            <div class="modal-number" id="modalNumber"></div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-body" id="modalBody"></div>
            <div id="resolutionArea" style="display:none; margin-bottom:20px;">
                <label class="form-label">Resolution Note</label>
                <textarea id="resolutionNote" placeholder="Explain how you resolved this issue..."></textarea>
            </div>
            <div class="modal-actions">
                <button id="resolveBtn" onclick="resolveCurrentTicket()" class="btn-primary" style="display:none; background: linear-gradient(135deg, var(--accent-success), #3db355); color: #0a0e27;">Resolve Ticket</button>
                <button onclick="closeModal()" class="btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script>
    let currentOpenTicket = null;

    window.addEventListener('DOMContentLoaded', () => {
        const p = new URLSearchParams(window.location.search);
        if (p.get('title'))       document.getElementById('title').value       = p.get('title');
        if (p.get('description')) document.getElementById('description').value = p.get('description');
        if (p.get('body'))        document.getElementById('body').value        = p.get('body');
        if (p.get('labels'))      document.getElementById('labels').value      = p.get('labels');
    });

    document.getElementById('ticketForm').addEventListener('submit', handleSubmit);

    function showSection(section, btn) {
        document.getElementById('createSection').style.display  = section === 'create' ? 'block' : 'none';
        document.getElementById('ticketsSection').style.display = section !== 'create' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        btn.classList.add('active');
        if (section !== 'create') loadTickets('open');
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = 'COMMITTING...';
        const rawLabels = document.getElementById('labels').value;
        const labels = rawLabels ? rawLabels.split(',').map(l => l.trim()).filter(Boolean) : ['lab-documentation'];
        const payload = {
            title:       document.getElementById('title').value,
            description: document.getElementById('description').value + '\n\n' + document.getElementById('body').value,
            labels:      labels
        };
        try {
            const res = await fetch('/api/ticket/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if (res.ok) { alert('SUCCESS: Ticket committed to repository.'); document.getElementById('ticketForm').reset(); }
            else { const err = await res.json(); alert('ERROR: ' + (err.error || 'Unknown error')); }
        } catch (e) { alert('ERROR: Could not reach Lab Manager. Is app.py running?'); }
        finally { btn.disabled = false; btn.innerText = 'COMMIT TO REPOSITORY'; }
    }

    async function loadTickets(state, btn) {
        document.getElementById('ticketsSection').style.display = 'block';
        document.getElementById('createSection').style.display  = 'none';
        const grid = document.getElementById('ticketsGrid');
        grid.innerHTML = '<div class="empty-state">SYNCHRONIZING...</div>';
        try {
            const res = await fetch(`/api/ticket/list?state=${state}`);
            const data = await res.json();
            if (data.tickets && data.tickets.length > 0) {
                grid.innerHTML = data.tickets.map(t => `
                    <div class="ticket-card" onclick="viewDetails(${t.number})">
                        <div class="ticket-number">LOG_ID: ${t.number}</div>
                        <div class="ticket-title">${t.title}</div>
                        <div class="ticket-status ${t.state === 'open' ? 'status-open' : 'status-closed'}">${t.state === 'open' ? 'ACTIVE' : 'RESOLVED'}</div>
                        <div class="ticket-tags">${(t.labels || []).map(l => `<span class="ticket-tag">${l}</span>`).join('')}</div>
                    </div>`).join('');
            } else { grid.innerHTML = '<div class="empty-state">NO RECORDS FOUND</div>'; }
        } catch (e) { grid.innerHTML = '<div class="empty-state">NETWORK_ERROR — Is app.py running?</div>'; }
        if (btn) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); btn.classList.add('active'); }
    }

    async function viewDetails(num) {
        try {
            const res  = await fetch(`/api/ticket/${num}`);
            const data = await res.json();
            currentOpenTicket = num;
            document.getElementById('modalNumber').innerText = `LOG_ID: ${data.number}`;
            document.getElementById('modalTitle').innerText  = data.title;
            document.getElementById('modalBody').innerText   = data.description || '(No details provided)';
            const resolveArea = document.getElementById('resolutionArea');
            const resolveBtn  = document.getElementById('resolveBtn');
            if (data.state === 'open') { resolveArea.style.display = 'block'; resolveBtn.style.display = 'block'; document.getElementById('resolutionNote').value = ''; }
            else { resolveArea.style.display = 'none'; resolveBtn.style.display = 'none'; }
            document.getElementById('ticketModal').classList.add('active');
        } catch (e) { alert('ERROR: Could not load ticket details.'); }
    }

    async function resolveCurrentTicket() {
        const note = document.getElementById('resolutionNote').value.trim();
        if (!note) { alert('Please provide a resolution note.'); return; }
        const btn = document.getElementById('resolveBtn');
        btn.disabled = true; btn.innerText = 'PROCESSING...';
        try {
            const res = await fetch(`/api/ticket/${currentOpenTicket}/close`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ resolution_note: note }) });
            if (res.ok) { closeModal(); loadTickets('open'); }
            else { alert('ERROR: Could not resolve ticket.'); }
        } catch (e) { alert('NETWORK ERROR: Action aborted.'); }
        finally { btn.disabled = false; btn.innerText = 'Resolve Ticket'; }
    }

    function closeModal() { document.getElementById('ticketModal').classList.remove('active'); }
    </script>
</body>
</html>
