apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-app-deployment
  labels:
    app: ticketing-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketing-app
  template:
    metadata:
      labels:
        app: ticketing-app
    spec:
      containers:
      - name: ticketing-app
        image: 922806890686.dkr.ecr.us-east-1.amazonaws.com/ticketing-app:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
   